<!-- Product card component: bakery item.
     Usage: place inside <ul class="product-grid"> and wrap each card in <li>. -->
<li>
  <article class="product-card">
    <figure class="product-card__media">
      <img
        class="product-card__image"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23f5ecd9'/%3E%3Cellipse cx='400' cy='330' rx='230' ry='150' fill='%23c17f0c'/%3E%3C/svg%3E"
        alt="Bochenek chleba zakwasowego z chrupiącą skórką"
        width="800"
        height="600"
        loading="lazy"
      >
    </figure>

    <div class="product-card__body">
      <span class="product-card__badge">Nowość</span>
      <h3 class="product-card__title">Chleb zakwasowy</h3>
      <p class="product-card__description">
        Długo fermentowany na naturalnym zakwasie, z chrupiącą skórką i wilgotnym miękiszem.
      </p>

      <div class="product-card__footer">
        <p class="product-card__price">
          <span class="visually-hidden">Cena:</span>
          18,50 zł
        </p>
        <a class="product-card__button" href="/wypieki/chleb-zakwasowy">
          Szczegóły<span class="visually-hidden"> o: Chleb zakwasowy</span>
        </a>
      </div>
    </div>
  </article>
</li>
